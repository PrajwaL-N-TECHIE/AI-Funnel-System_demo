<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=screen1.html">
  <title>Buildicy AI Funnel — Interactive Demo</title>
  <script src="config/demoConfig.js"></script>
  <script>
    if (window.DEMO_CONFIG && window.DEMO_CONFIG.businessName) {
      document.title = window.DEMO_CONFIG.businessName + " — AI Funnel System | Interactive Demo by Buildicy";
    }
    window.location.replace("screen1.html");
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F8FAFC; color: #0B1F3A; padding: 60px 20px; text-align: center;">
  <div style="max-width: 480px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); border: 1px solid #E2E8F0;">
    <h2 id="demoTitle" style="margin-top: 0; font-size: 20px;">Buildicy AI Funnel — Interactive Demo</h2>
    <p id="demoRedirectText" style="color: #64748B; font-size: 14px;">Redirecting to Screen 1...</p>
    <a href="screen1.html" style="display: inline-block; margin-top: 10px; padding: 10px 20px; background: #25D366; color: #0B1F3A; font-weight: bold; text-decoration: none; border-radius: 10px;">Launch Screen 1</a>
  </div>
  <script>
    if (window.DEMO_CONFIG) {
      const cfg = window.DEMO_CONFIG;
      if (cfg.businessName) {
        document.getElementById('demoTitle').textContent = cfg.businessName + " — AI Funnel Simulation";
      }
      if (cfg.customerNoun) {
        document.getElementById('demoRedirectText').textContent = "Redirecting to Screen 1 (" + cfg.customerNoun + " Eligibility Form)...";
      }
    }
  </script>
</body>
</html>
