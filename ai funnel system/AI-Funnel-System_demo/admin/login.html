<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Buildicy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: '#25D366', navy: '#0B1F3A' }, fontFamily: { sans: ['Inter','sans-serif'] } } } }</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .ambient { background-color:#F8FAFC; background-image:radial-gradient(#CBD5E1 0.75px,transparent 0.75px); background-size:24px 24px; }
    .card { background:white; border:1px solid #E2E8F0; border-radius:20px; box-shadow:0 20px 50px -10px rgba(11,31,58,0.1); }
    input:focus { outline:none; border-color:#25D366; box-shadow:0 0 0 3px rgba(37,211,102,0.12); }
    .shake { animation: shake 0.4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
  </style>
</head>
<body class="ambient min-h-screen flex items-center justify-center font-sans">

  <div class="w-full max-w-sm px-4">
    <div class="card p-8 space-y-6">

      <!-- Logo -->
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-navy flex items-center justify-center mx-auto shadow-md">
          <i data-lucide="shield-check" class="w-6 h-6 text-brand"></i>
        </div>
        <h1 class="text-xl font-bold text-navy" style="font-family:Inter,sans-serif">Buildicy Admin</h1>
        <p class="text-xs text-slate-400">Sign in to access the control panel</p>
      </div>

      <!-- Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">

        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Username</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input id="username" type="text" placeholder="Enter username" autocomplete="off"
              class="w-full pl-9 pr-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 text-slate-800 transition">
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input id="password" type="password" placeholder="Enter password" autocomplete="off"
              class="w-full pl-9 pr-10 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 text-slate-800 transition">
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div id="errorMsg" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2 flex items-center gap-2">
          <i data-lucide="alert-circle" class="w-3.5 h-3.5 shrink-0"></i>
          <span>Invalid username or password.</span>
        </div>

        <button type="submit"
          class="w-full py-2.5 bg-navy hover:bg-slate-800 text-white text-sm font-semibold rounded-xl flex items-center justify-center gap-2 transition shadow-sm">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          Sign In
        </button>
      </form>

      <p class="text-center text-[11px] text-slate-400">
        Built by <strong class="text-navy">Buildicy</strong> — AI Growth Systems Studio
      </p>
    </div>
  </div>

  <script>
    // Check if already logged in
    if (localStorage.getItem('buildicy_admin_auth') === 'true') {
      window.location.replace('index.html');
    }

    // Credentials — change these as needed
    const ADMIN_CREDENTIALS = {
      username: 'buildicy',
      password: 'admin@2026'
    };

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const err = document.getElementById('errorMsg');
      const form = document.getElementById('loginForm');

      if (u === ADMIN_CREDENTIALS.username && p === ADMIN_CREDENTIALS.password) {
        localStorage.setItem('buildicy_admin_auth', 'true');
        window.location.replace('index.html');
      } else {
        err.classList.remove('hidden');
        form.classList.add('shake');
        setTimeout(() => form.classList.remove('shake'), 400);
        if (window.lucide) lucide.createIcons();
      }
    }

    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      if (window.lucide) lucide.createIcons();
    }

    lucide.createIcons();
  </script>
</body>
</html>
